function modalProduto(id){
  const p=id?state.produtos.find(x=>x.id===id):{nome:'',categoria:'Outros',descricao:'',preco:'',validade:'',estoque:'',fotoUrl:''};
  prodFoto=p.fotoUrl||'';
  openModal(`
    <div class="modal-head"><h2>${id?'Editar':'Novo'} Produto</h2><button onclick="closeModal()">${ICON.x(20)}</button></div>
    <div class="field"><label class="lbl">Foto do Produto</label>
      <label style="display:block;cursor:pointer" id="p-foto-label">${prodFoto?`<div style="position:relative"><img src="${prodFoto}" style="width:100%;height:130px;object-fit:cover;border-radius:8px;border:1px solid var(--border)"><div style="position:absolute;bottom:8px;right:8px;padding:3px 8px;background:rgba(0,0,0,.7);border-radius:5px;font-size:11px">Alterar</div></div>`:`<div style="border:2px dashed var(--border);border-radius:8px;padding:22px;text-align:center;color:var(--text-3)">${ICON.package(22,'#252525')}<div style="margin-top:7px;font-size:12px">Clique para adicionar foto</div></div>`}
        <input type="file" accept="image/*" style="display:none" onchange="lerFoto(event)"></label></div>
    <div class="field"><label class="lbl">Nome</label><input id="p-nome" class="inp" value="${esc(p.nome)}" placeholder="Nome do produto"></div>
    <div class="field"><label class="lbl">Categoria</label><select id="p-cat" class="inp">${CATS_PROD.map(c=>`<option ${p.categoria===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="field"><label class="lbl">Descrição</label><input id="p-desc" class="inp" value="${esc(p.descricao)}" placeholder="Opcional"></div>
    <div class="row2"><div class="field"><label class="lbl">Preço (R$)</label><input id="p-preco" type="number" step="0.01" min="0" class="inp" value="${p.preco}" placeholder="0,00"></div>
      <div class="field"><label class="lbl">Estoque</label><input id="p-est" type="number" min="0" class="inp" value="${p.estoque}" placeholder="0"></div></div>
    <div class="field"><label class="lbl">Data de Validade</label><input id="p-val" type="date" class="inp" value="${p.validade||''}"></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveProduto('${id||''}')">Salvar</button></div>
  `);
}
function lerFoto(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async ev=>{
    prodFoto=await comprimirFoto(ev.target.result);
    document.getElementById('p-foto-label').innerHTML=`<div style="position:relative"><img src="${prodFoto}" style="width:100%;height:130px;object-fit:cover;border-radius:8px;border:1px solid var(--border)"><div style="position:absolute;bottom:8px;right:8px;padding:3px 8px;background:rgba(0,0,0,.7);border-radius:5px;font-size:11px">Alterar</div></div><input type="file" accept="image/*" style="display:none" onchange="lerFoto(event)">`;
  };
  r.readAsDataURL(f);
}
function saveProduto(id){
  const g=x=>document.getElementById(x).value;
  const nome=g('p-nome').trim(); if(!nome){ alert('Informe o nome.'); return; }
  const data={nome,categoria:g('p-cat'),descricao:g('p-desc').trim(),preco:parseFloat(g('p-preco'))||0,validade:g('p-val'),estoque:g('p-est')!==''?parseInt(g('p-est')):'',fotoUrl:prodFoto};
  if(id) state.produtos=state.produtos.map(p=>p.id===id?{...p,...data}:p);
  else state.produtos.push({...data,id:uid(),createdAt:Date.now()});
  save('produtos'); closeModal(); render();
}

      <div style="border-top:1px solid var(--border);margin-top:12px;padding-top:12px">

    ${cfgTab==='nuvem'?`<div class="card">
      <h3 style="font-size:14px;margin-bottom:6px">☁️ Supabase (recomendado)</h3>

        1️⃣ Acesse <a href="https://supabase.com" target="_blank" style="color:var(--gold)">supabase.com</a> → crie conta gratuita<br>

function cfg_setComissao(b,v){ if(!state.config.comissoes) state.config.comissoes={}; state.config.comissoes[b]=parseFloat(v)||0; saveConfig(); }
function cfg_delFixa(i){ state.config.despesasFixas.splice(i,1); saveConfig(); render(); }
function modalDespesaFixa(){
  openModal(`
    <div class="modal-head"><h2>Nova Despesa Fixa</h2><button onclick="closeModal()">${ICON.x(20)}</button></div>
    <div class="field"><label class="lbl">Nome</label><input id="df-nome" class="inp" placeholder="Ex: Aluguel, Luz, Internet..."></div>
    <div class="row2">
      <div class="field"><label class="lbl">Valor (R$)</label><input id="df-valor" type="number" step="0.01" class="inp" placeholder="0,00"></div>
      <div class="field"><label class="lbl">Dia do mês</label><input id="df-dia" type="number" min="1" max="28" class="inp" value="1"></div>
    </div>
    <div class="field"><label class="lbl">Categoria</label><select id="df-cat" class="inp"><option value="aluguel">Aluguel</option><option value="energia">Energia/Água</option><option value="internet">Internet/Telefone</option><option value="salario">Salário</option><option value="despesa" selected>Outros</option></select></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveDespesaFixa()">Salvar</button></div>
  `);
}
function saveDespesaFixa(){
  const nome=document.getElementById('df-nome').value.trim();
  const valor=parseFloat(document.getElementById('df-valor').value)||0;
  const dia=parseInt(document.getElementById('df-dia').value)||1;
  const categoria=document.getElementById('df-cat').value;
  if(!nome||!valor){ alert('Preencha nome e valor.'); return; }
  state.config.despesasFixas.push({id:uid(),nome,valor,dia,categoria});
  saveConfig(); closeModal(); render();
}
function lancarDespesasFixas(){
  const mes=todayStr().slice(0,7);
  const jaLancadas=state.lancamentos.filter(l=>l.despesaFixa&&(l.data||'').startsWith(mes)).map(l=>l.despesaFixa);
  const novas=state.config.despesasFixas.filter(d=>!jaLancadas.includes(d.id));
  if(!novas.length){ alert('Todas as despesas fixas já foram lançadas este mês.'); return; }
  novas.forEach(d=>{
    const dia=String(d.dia).padStart(2,'0');
    state.lancamentos.push({id:uid(),tipo:'saida',descricao:d.nome,valor:d.valor,valorLiquido:d.valor,formaPagamento:'pix',categoria:d.categoria||'despesa',data:`${mes}-${dia}`,despesaFixa:d.id,createdAt:Date.now()});
  });
  save('lancamentos'); render();
  alert(`✅ ${novas.length} despesa(s) lançadas para ${mes}.`);
}
function cfg_addDono(){ const v=document.getElementById('novo-dono-email')?.value.trim(); if(!v||!v.includes('@')){ alert('Digite um email válido.'); return; } if(!state.config.donos) state.config.donos=[]; if(state.config.donos.includes(v)){ alert('Email já cadastrado.'); return; } state.config.donos.push(v); saveConfig(); render(); }
function cfg_delDono(i){ state.config.donos.splice(i,1); saveConfig(); render(); }
function cfg_addBarbeiroAuth(){ const nome=document.getElementById('novo-func-nome')?.value.trim(); const email=document.getElementById('novo-func-email')?.value.trim(); if(!nome||!email||!email.includes('@')){ alert('Preencha nome e email válido.'); return; } if(!state.config.barbeirosAuth) state.config.barbeirosAuth=[]; if(state.config.barbeirosAuth.some(b=>b.email===email)){ alert('Email já cadastrado.'); return; } state.config.barbeirosAuth.push({nome,email}); saveConfig(); render(); }
function cfg_delBarbeiroAuth(i){ state.config.barbeirosAuth.splice(i,1); saveConfig(); render(); }
function cfg_set(path,v){ const k=path.split('.'); let o=state.config; for(let i=0;i<k.length-1;i++)o=o[k[i]]; o[k[k.length-1]]=v; saveConfig(); }
function cfg_setNum(k,v){ state.config[k]=parseFloat(v)||0; saveConfig(); }
function cfg_addArr(key,inp){ const v=inp.value.trim(); if(v){ state.config[key].push(v); saveConfig(); render(); } }
function cfg_delArr(key,i){ state.config[key].splice(i,1); saveConfig(); render(); }
function cfg_setServ(i,campo,v){ state.config.servicos[i][campo]=parseFloat(v)||0; saveConfig(); }
function cfg_addServico(){
  const nome=document.getElementById('serv-nome').value.trim();
  const preco=parseFloat(document.getElementById('serv-preco').value)||0;
  const duracao=parseFloat(document.getElementById('serv-dur').value)||30;
  if(!nome) return;
  state.config.servicos.push({nome,preco,duracao}); saveConfig(); render();
}
function cfg_addLocal(inp){ const v=inp.value.trim(); if(v){ state.config.locais.push({id:uid(),nome:v}); saveConfig(); render(); } }
function cfg_delLocal(i){ state.config.locais.splice(i,1); saveConfig(); render(); }
function cfg_togLembrete(id){ state.config.lembretes=state.config.lembretes.map(l=>l.id===id?{...l,ativo:!l.ativo}:l); saveConfig(); render(); }
function cfg_delLembrete(id){ state.config.lembretes=state.config.lembretes.filter(l=>l.id!==id); saveConfig(); render(); }
function modalLembrete(id){
  const l=id?state.config.lembretes.find(x=>x.id===id):null;
  openModal(`
    <div class="modal-head"><h2>${l?'Editar':'Novo'} Lembrete</h2><button onclick="closeModal()">${ICON.x(20)}</button></div>
    <div class="field"><label class="lbl">Enviar quantas horas antes?</label><input id="lb-horas" type="number" min="1" class="inp" value="${l?l.horasAntes:24}"></div>
    <div class="field"><label class="lbl">Mensagem</label><div style="font-size:11px;color:var(--text-3);margin-bottom:6px">Variáveis: ${VARS.join(', ')}</div>
      <textarea id="lb-tpl" class="inp" style="min-height:90px">${esc(l?l.template:'Olá {nome}! 🗓️ Lembrando do seu horário às {hora} para {servico}. Te esperamos! ✂️')}</textarea></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveLembrete('${id||''}')">Salvar</button></div>
  `);

function saveLembrete(id){
  const h=parseInt(document.getElementById('lb-horas').value)||1;
  const t=document.getElementById('lb-tpl').value.trim();
  if(!t){ alert('Escreva a mensagem.'); return; }
  if(id){ state.config.lembretes=state.config.lembretes.map(l=>l.id===id?{...l,horasAntes:h,template:t}:l); }
  else { state.config.lembretes.push({id:uid(),horasAntes:h,template:t,ativo:true}); }
  saveConfig(); closeModal(); render();
}
/* ============ RECUPERAÇÃO FIREBASE ============ */
function recuperarDoFirebase(){
  if(!db){ alert('Firebase não está conectado. Verifique sua conexão.'); return; }
  if(!confirm('Isso vai recarregar todos os dados da nuvem Firebase e substituir os dados atuais.\nContinuar?')) return;
  setCloudStatus('🔄 Recarregando da nuvem...','#9CA3AF');
  db.collection('dados').get().then(snap=>{
    if(snap.empty){ alert('Nenhum dado encontrado no Firebase.\n\nSe as regras expiraram, acesse:\nFirebase Console → Firestore → Regras\ne publique:\nallow read, write: if true;'); setCloudStatus('',''); return; }
    snap.forEach(doc=>{ const d=doc.data(); if(doc.id==='config'){ if(d&&d.value) state.config=d.value; } else if(doc.id==='notas'){ if(d&&d.value!==undefined) state.notas=d.value; } else if(d&&d.items) state[doc.id]=d.items; });
    ['clientes','agendamentos','lancamentos','produtos','lembretesEnviados','notifAlteracao'].forEach(k=>save(k));
    saveConfig(); LS.set('bc:notas',state.notas); migrarDados(); render();
    setCloudStatus('✅ Dados recuperados!','#22C55E');
    alert('✅ Dados recuperados com sucesso!\n\nAgora use "Exportar backup" para guardar uma cópia local.');
  }).catch(e=>{ alert('❌ Erro: '+e.message); setCloudStatus('',''); });
}

/* ============ BACKUP ============ */
function exportarBackup(){
  const dados={clientes:state.clientes,agendamentos:state.agendamentos,lancamentos:state.lancamentos,produtos:state.produtos,lembretesEnviados:state.lembretesEnviados,notifAlteracao:state.notifAlteracao,notas:state.notas,config:state.config,exportadoEm:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(dados,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='backup-barbearia-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function importarBackup(e){
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(d.agendamentos) state.agendamentos=d.agendamentos;
      if(d.clientes) state.clientes=d.clientes;
      if(d.lancamentos) state.lancamentos=d.lancamentos;
      if(d.produtos) state.produtos=d.produtos;
      if(d.lembretesEnviados) state.lembretesEnviados=d.lembretesEnviados;
      if(d.notifAlteracao) state.notifAlteracao=d.notifAlteracao;
      if(d.config) state.config=d.config;
      if(d.notas!==undefined){ state.notas=d.notas; LS.set('bc:notas',state.notas); if(db) db.collection('dados').doc('notas').set({value:state.notas}).catch(()=>{}); }
      ['agendamentos','clientes','lancamentos','produtos','lembretesEnviados','notifAlteracao'].forEach(k=>save(k));
      saveConfig(); migrarDados(); render();
      alert('✅ Backup restaurado com sucesso!');
    }catch(err){ alert('❌ Arquivo inválido. Verifique se é um backup gerado por este sistema.'); }
  };
  r.readAsText(file);
}

/* ============ INIT ============ */
async function carregarDados(){
  if(db){
    setCloudStatus('☁️ Carregando...','#9CA3AF');
    try{
      const snap=await db.collection('dados').get();
      if(!snap.empty){
        const localPrds=LS.get('bc:produtos')||[];
        snap.forEach(doc=>{
          const d=doc.data();
          if(doc.id==='config'){ if(d&&d.value) state.config=d.value; }
          else if(doc.id==='notas'){ if(d&&d.value!==undefined) state.notas=d.value; }
          else if(doc.id==='produtos'&&d&&d.items){
            state.produtos=d.items.map(p=>{ const loc=localPrds.find(lp=>lp.id===p.id); return loc?.fotoUrl?{...p,fotoUrl:loc.fotoUrl}:p; });
          }
          else if(d&&d.items) state[doc.id]=d.items;
        });
        migrarDados();
        ['clientes','agendamentos','lancamentos','produtos','lembretesEnviados','notifAlteracao','pacotes'].forEach(k=>LS.set('bc:'+k,state[k]));
        LS.set('bc:config',state.config); LS.set('bc:notas',state.notas);
      } else {
        ['clientes','agendamentos','lancamentos','produtos','lembretesEnviados','notifAlteracao','pacotes'].forEach(k=>save(k));
        saveConfig();
        if(state.notas) db.collection('dados').doc('notas').set({value:state.notas}).catch(()=>{});
      }
      setCloudStatus('☁️ Firebase sincronizado','#22C55E');
    }catch(e){ console.warn('Firebase load:',e); setCloudStatus('⚠️ Sem conexão — dados locais','#F59E0B'); }
  } else if(SB_URL&&SB_URL.length>10){
    setCloudStatus('☁️ Carregando Supabase...','#9CA3AF');
    const ok=await cloudLoad();
    setCloudStatus(ok?'☁️ Supabase sincronizado':'⚠️ Sem conexão — dados locais',ok?'#22C55E':'#F59E0B');
  }
}

async function boot(){
  migrarDados();
  applyTema();
  const viewEl=document.getElementById('view');
  if(viewEl) viewEl.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:60vh;flex-direction:column;gap:14px"><div style="width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite"></div><p style="font-size:13px;color:var(--text-3)">Carregando...</p></div>`;
  if(auth){
    try{
      // Aguarda resultado do redirect (pode ter voltado do Google agora)
      const result = await auth.getRedirectResult();
      if(result && result.user){
        authUser = result.user;
        await carregarDados();
        migrarDados();
        await verificarRole();
        if(authRole!=='unauthorized'){
          esconderLogin(); render();
          startNotificacoes();
          return;
        }
        mostrarLogin(); return;
      }
    }catch(e){ console.warn('redirect result:',e); }
    // Nenhum redirect pendente — usar estado normal de auth
    auth.onAuthStateChanged(async user=>{
      authUser=user;
      if(user){
        await carregarDados(); migrarDados(); await verificarRole();
        if(authRole==='unauthorized'){ mostrarLogin(); return; }
        esconderLogin(); render();
        startNotificacoes();
      } else {
        mostrarLogin();
      }
    });
  } else {
    // Sem Firebase — modo local, sem auth
    await carregarDados();
    render();
    startNotificacoes();
  }
}
boot();
window.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeModal(); closeDrawer(); } });
